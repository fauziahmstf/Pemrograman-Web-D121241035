<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portal jurnal ilmiah Fakultas Teknik.">
    <title>Portal Jurnal Ilmiah Fakultas Teknik</title>

    <!-- Bootstrap 5 melalui CDN dengan atribut integrity -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"

        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"

    <link rel="stylesheet" href="04-tugas-style.css">

        <div class="header-inner">

            <nav aria-label="navigasi utama">

                    <li><a class="active" href="#">Beranda</a></li>

    <main class="portal-layout">

            <h2 id="sidebar-title">Menu Jurnal</h2>

            <ul class="sidebar-menu">
