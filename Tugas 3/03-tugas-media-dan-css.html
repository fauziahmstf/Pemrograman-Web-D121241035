<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemutar Media Kuliah Responsif</title>

    <link rel="stylesheet" href="03-tugas-style.css">
</head>
<body>
    <picture>
        <source media="(min-width: 768px)" srcset="cover-desktop.webp">
        <source media="(min-width: 767px)" srcset="cover-mobile.webp">
        
        <img src="cover-mobile.webp" alt="cover pemrograman web">
    </picture>
    
    <video controls poster="cover-video.png">
        <source src="demo.webm" type="video/webm">
        <source src="demo.mp4" type="video/mp4">

        Browser Anda tidak mendukung pemutaran video HTML5.
    </video>

    <audio controls preload="metadata">
        <source src="file_example_OOG_1MG.ogg" type="audio/ogg">
        <source src="file_example_MP3_700KB.mp3" type="audio/mp3">

        Browser Anda tidak mendukung pemutaran audio HTML5.
    </audio>
</body>
</html>
